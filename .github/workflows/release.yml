name: Release

on:
  push:
    tags:
      - 'release/*'

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore MeisterDev.ProPR.slnx

      - name: Build
        run: dotnet build MeisterDev.ProPR.slnx --no-restore --configuration Release

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore MeisterDev.ProPR.slnx

      - name: Run domain tests
        run: dotnet test tests/MeisterDev.ProPR.Domain.Tests/MeisterDev.ProPR.Domain.Tests.csproj --no-restore --configuration Release --verbosity normal

      - name: Run application tests
        run: dotnet test tests/MeisterDev.ProPR.Application.Tests/MeisterDev.ProPR.Application.Tests.csproj --no-restore --configuration Release --verbosity normal

      - name: Run infrastructure tests
        run: dotnet test tests/MeisterDev.ProPR.Infrastructure.Tests/MeisterDev.ProPR.Infrastructure.Tests.csproj --no-restore --configuration Release --verbosity normal

      - name: Run API tests
        run: dotnet test tests/MeisterDev.ProPR.Api.Tests/MeisterDev.ProPR.Api.Tests.csproj --no-restore --configuration Release --verbosity normal

      - name: Run ProCursor service tests
        run: dotnet test tests/MeisterDev.ProPR.ProCursor.Service.Tests/MeisterDev.ProPR.ProCursor.Service.Tests.csproj --no-restore --configuration Release --verbosity normal

  release:
    name: Build, push, and sign images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Parse version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/release/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Stable: exactly N.N.N — anything else (alpha, beta, rc …) is pre-release
          if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image names (lowercase)
        id: images
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=${{ env.REGISTRY }}/${REPO}" >> "$GITHUB_OUTPUT"
          echo "procursor=${{ env.REGISTRY }}/${REPO}/procursor" >> "$GITHUB_OUTPUT"
          echo "frontend=${{ env.REGISTRY }}/${REPO}/frontend" >> "$GITHUB_OUTPUT"
          echo "runner=${{ env.REGISTRY }}/${REPO}/runner" >> "$GITHUB_OUTPUT"

      - name: Compute Docker tags
        id: tags
        run: |
          BACKEND="${{ steps.images.outputs.backend }}"
          PROCURSOR="${{ steps.images.outputs.procursor }}"
          FRONTEND="${{ steps.images.outputs.frontend }}"
          RUNNER="${{ steps.images.outputs.runner }}"
          VERSION="${{ steps.version.outputs.version }}"

          if [ "${{ steps.version.outputs.is_prerelease }}" = "true" ]; then
            # Pre-release: version tag only — do not move latest
            {
              echo "backend<<ENDOFTAGS"
              echo "${BACKEND}:${VERSION}"
              echo "ENDOFTAGS"
              echo "procursor<<ENDOFTAGS"
              echo "${PROCURSOR}:${VERSION}"
              echo "ENDOFTAGS"
              echo "frontend<<ENDOFTAGS"
              echo "${FRONTEND}:${VERSION}"
              echo "ENDOFTAGS"
              echo "runner<<ENDOFTAGS"
              echo "${RUNNER}:${VERSION}"
              echo "ENDOFTAGS"
            } >> "$GITHUB_OUTPUT"
          else
            # Stable release: version tag + latest
            {
              echo "backend<<ENDOFTAGS"
              echo "${BACKEND}:${VERSION}"
              echo "${BACKEND}:latest"
              echo "ENDOFTAGS"
              echo "procursor<<ENDOFTAGS"
              echo "${PROCURSOR}:${VERSION}"
              echo "${PROCURSOR}:latest"
              echo "ENDOFTAGS"
              echo "frontend<<ENDOFTAGS"
              echo "${FRONTEND}:${VERSION}"
              echo "${FRONTEND}:latest"
              echo "ENDOFTAGS"
              echo "runner<<ENDOFTAGS"
              echo "${RUNNER}:${VERSION}"
              echo "${RUNNER}:latest"
              echo "ENDOFTAGS"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend image

      - name: Build backend image
        id: build-backend
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          pull: true
          tags: ${{ steps.tags.outputs.backend }}
          build-args: |
            PRODUCT_VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=Meister DEV ProPR
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves that the locally built image carries the publisher's licensing trust anchor and verifies a license
      # signed under it. The tests cannot establish this: they sign with chains they generate, so a build whose
      # anchor was replaced or corrupted would pass them. The following push publishes these locally verified tags
      # without rebuilding the image.
      #
      # The license in LICENSING_RELEASE_CHECK_TOKEN is issued with nothing listed under its capabilities and
      # every limit at zero, so a leaked copy grants no capability worth having and no headroom under any limit.
      # The step runs on every release, so a missing secret fails the release rather than skipping the check.

      - name: Verify backend image licensing
        env:
          LICENSE: ${{ secrets.LICENSING_RELEASE_CHECK_TOKEN }}
        run: |
          if [ -z "$LICENSE" ]; then
            echo "LICENSING_RELEASE_CHECK_TOKEN is empty. It has to hold a license issued from the publisher's chain, which this step verifies inside the built image to prove the image accepts one." >&2
            exit 1
          fi
          printf '%s' "$LICENSE" | docker run --rm --interactive \
            "${{ steps.images.outputs.backend }}:${{ steps.version.outputs.version }}" \
            --verify-license -

      - name: Push verified backend image
        id: push-backend
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<'TAGS'
          ${{ steps.tags.outputs.backend }}
          TAGS

          digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${{ steps.images.outputs.backend }}:${{ steps.version.outputs.version }}")"
          [ -n "$digest" ]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest backend image
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ steps.images.outputs.backend }}
          subject-digest: ${{ steps.push-backend.outputs.digest }}
          push-to-registry: true

      - name: Scan backend image
        uses: anchore/scan-action@v7.4.0
        id: scan-backend
        with:
          image: ${{ steps.images.outputs.backend }}@${{ steps.push-backend.outputs.digest }}
          fail-build: false
          output-format: sarif

      - name: Upload backend scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: ${{ steps.scan-backend.outputs.sarif }}
          category: backend-image

      # Runner image
      #
      # Published from the same release as the control plane. A runner has to stay inside the contract
      # compatibility window of the control plane it leases from, so one tag covers the pair that is known
      # to work together.

      - name: Build and push runner image
        id: build-runner
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile.runner
          push: true
          pull: true
          tags: ${{ steps.tags.outputs.runner }}
          labels: |
            org.opencontainers.image.title=Meister DEV ProPR Runner
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest runner image
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ steps.images.outputs.runner }}
          subject-digest: ${{ steps.build-runner.outputs.digest }}
          push-to-registry: true

      - name: Scan runner image
        uses: anchore/scan-action@v7.4.0
        id: scan-runner
        with:
          image: ${{ steps.images.outputs.runner }}@${{ steps.build-runner.outputs.digest }}
          fail-build: false
          output-format: sarif

      - name: Upload runner scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: ${{ steps.scan-runner.outputs.sarif }}
          category: runner-image

      # ProCursor image

      - name: Build and push ProCursor image
        id: build-procursor
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: procursor.dockerfile
          push: true
          pull: true
          tags: ${{ steps.tags.outputs.procursor }}
          labels: |
            org.opencontainers.image.title=Meister DEV ProPR ProCursor
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest ProCursor image
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ steps.images.outputs.procursor }}
          subject-digest: ${{ steps.build-procursor.outputs.digest }}
          push-to-registry: true

      - name: Scan ProCursor image
        uses: anchore/scan-action@v7.4.0
        id: scan-procursor
        with:
          image: ${{ steps.images.outputs.procursor }}@${{ steps.build-procursor.outputs.digest }}
          fail-build: false
          output-format: sarif

      - name: Upload ProCursor scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: ${{ steps.scan-procursor.outputs.sarif }}
          category: procursor-image

      # Frontend image

      - name: Build and push frontend image
        id: build-frontend
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          pull: true
          tags: ${{ steps.tags.outputs.frontend }}
          labels: |
            org.opencontainers.image.title=Meister DEV ProPR Management Interface
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest frontend image
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ steps.images.outputs.frontend }}
          subject-digest: ${{ steps.build-frontend.outputs.digest }}
          push-to-registry: true

      - name: Scan frontend image
        uses: anchore/scan-action@v7.4.0
        id: scan-frontend
        with:
          image: ${{ steps.images.outputs.frontend }}@${{ steps.build-frontend.outputs.digest }}
          fail-build: false
          output-format: sarif

      - name: Upload frontend scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: ${{ steps.scan-frontend.outputs.sarif }}
          category: frontend-image
