# Image tags identify the supported release streams; digests pin immutable builds.
# Weekly Docker updates refresh these pins in Dockerfile, Dockerfile.runner,
# procursor.dockerfile and frontend/Dockerfile, grouped into one PR per directory.
# CI actions and application dependencies are updated on the same schedule.
version: 2
updates:
  - package-ecosystem: docker
    directory: "/"            # Dockerfile + Dockerfile.runner + procursor.dockerfile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-base-images:
        patterns: ["*"]
    # The kerberos and gittools stages copy shared libraries into the noble-based chiseled
    # runtime image, so their Ubuntu release must match the runtime's release. Dependabot
    # refreshes the 24.04 digest and leaves the release change to the runtime image move.
    # ProPR stays on the .NET LTS release. Dependabot refreshes the 10.0 digests of the SDK
    # and runtime images and proposes no newer major version.
    ignore:
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: "/frontend"    # frontend/Dockerfile
    schedule:
      interval: weekly
    groups:
      docker-base-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"            # .github/workflows/*
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Frontend JS deps (would have flagged the vite/esbuild advisory).
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm:
        patterns: ["*"]

  # .NET deps. Point straight at each project dir (every csproj is one level deep
  # under src/ and tests/) so discovery doesn't depend on .slnx solution parsing.
  - package-ecosystem: nuget
    directories:
      - "/src/*"
      - "/tests/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nuget:
        patterns: ["*"]
