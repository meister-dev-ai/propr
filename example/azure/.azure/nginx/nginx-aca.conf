server {
    proxy_http_version 1.1;
    listen 8080;
    server_name localhost;

    absolute_redirect off;

    # This proxy calls the apps on their internal ingress over HTTPS, with SNI and certificate verification. The
    # ingress overwrites X-Forwarded-Proto with the protocol of the connection it receives, so the backend sees https
    # only when this proxy calls it over HTTPS. Over HTTP, the backend refuses the ProPR Lens sign-in and sets its
    # cookies without the Secure attribute. This proxy therefore sets no X-Forwarded-Proto of its own.
    proxy_ssl_server_name          on;
    proxy_ssl_verify               on;
    proxy_ssl_verify_depth         2;
    proxy_ssl_trusted_certificate  /etc/ssl/certs/ca-certificates.crt;

    location = /favicon.ico {
        return 204;
        access_log off;
    }

    location = /admin {
        return 308 /;
    }

    location ^~ /admin/ {
        rewrite ^/admin/(.*)$ /$1 permanent;
    }

    location = /api {
        return 308 /api/;
    }

    # The backend maps the anonymous Prometheus scraping endpoint at /metrics, which the
    # /api/ proxy below would otherwise surface publicly as /api/metrics. Metrics are for
    # in-environment scrapers reaching the backend directly on its internal ingress, so
    # block the endpoint at the public edge. Return 404 to avoid confirming it exists.
    location = /api/metrics {
        return 404;
    }

    location ^~ /api/ {
        proxy_pass         https://${BACKEND_HOST}/;
        proxy_set_header   Host              ${BACKEND_HOST};
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Over HTTPS as well, because the browser sends the session cookie, whose path is /, with every request to the
    # frontend.
    location / {
        proxy_pass         https://${FRONTEND_HOST};
        proxy_set_header   Host              ${FRONTEND_HOST};
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
